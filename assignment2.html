<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Registration Form</title>
</head>
<body>
  <h1>User Registration Form</h1>

  <form action="#" method="post">

    <label for="fname">First Name:</label>
    <input type="text" id="fname" name="fname" placeholder="Enter your first name" required />
    <br>
    <label for="lname">Last Name:</label>
    <input type="text" id="lname" name="lname" placeholder="Enter your last name" required />
    <br>
    <label for="email">Email Address:</label>
    <input type="email" id="email" name="email" placeholder="example@email.com" required />
    <br>
    <label for="password">Password:</label>
    <input type="password" id="password" name="password" placeholder="At least 8 characters" required />
     <br>
    <label for="dob">Date of Birth:</label>
    <input type="date" id="dob" name="dob" required />
    <br>
    <label for="country">Country:</label>
    <select id="country" name="country" required>
      <option value="">-- Select your country --</option>
      <option value="palestine">Palestine</option>
      <option value="usa">United States</option>
      <option value="uk">United Kingdom</option>
      <option value="canada">Canada</option>
      <option value="other">Other</option>
    </select>
    <br>
    <label>Gender:</label>
    <div class="radio-group">
      <div>
        <input type="radio" id="male" name="gender" value="male" />
        <label for="male">Male</label>
      </div>
      <div>
        <input type="radio" id="female" name="gender" value="female" />
        <label for="female">Female</label>
      </div>
      <div>
        <input type="radio" id="other" name="gender" value="other" />
        <label for="other">Prefer not to say</label>
      </div>
    </div>
    <br>
    <label>Interests (choose all that apply):</label>
    <div class="checkbox-group">
      <div>
        <input type="checkbox" id="tech" name="interests" value="tech" />
        <label for="tech">Technology</label>
      </div>
      <div>
        <input type="checkbox" id="design" name="interests" value="design" />
        <label for="design">Design</label>
      </div>
      <div>
        <input type="checkbox" id="science" name="interests" value="science" />
        <label for="science">Science</label>
      </div>
      <div>
        <input type="checkbox" id="arts" name="interests" value="arts" />
        <label for="arts">Arts</label>
      </div>
    </div>
     <br>
    <label for="experience">
      Experience Level: <span id="range-value">3</span> / 5
    </label>
    <input
      type="range"
      id="experience"
      name="experience"
      min="1"
      max="5"
      value="3"
      oninput="document.getElementById('range-value').textContent = this.value"
    />
     <br>
    <label for="photo">Profile Photo:</label>
    <input type="file" id="photo" name="photo" accept="image/*" />
     <br>
    <label for="bio">Short Bio:</label>
    <textarea id="bio" name="bio" rows="4" placeholder="Tell us about yourself..." maxlength="300"></textarea>
     <br>
    <div style="margin-top: 15px;">
      <input type="checkbox" id="terms" name="terms" required />
      <label for="terms" style="display:inline; font-weight:normal;">
        I agree to the Terms and Conditions
      </label>
    </div>
   <br>
    <input type="submit" value="Register Now" />

  </form>

</body>
</html>
